<style>

@font-face{font-family:Lato;src:url(assets/lato-700.a53ca001.woff2) format('woff2');font-weight:600 900;font-display:swap}
:root{--brand:#14506B;--ink:#14181D;--muted:#4A5661;--line:#C9D1D9;--bg:#EEF2F5;--surface:#fff;--soft:#E3EBF0;--exp:#B3261E;--ok:#1E7A45}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Lato,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}

.center{text-align:center}.big{font-size:26px;font-weight:900;color:var(--brand);margin:6px 0 14px}

.grid2{display:grid;grid-template-columns:1fr;gap:0 16px}@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}label i{color:var(--exp);font-style:normal}

<body>
<header class="top"><img src="assets/logo-round.3f5b0675.webp" alt=""><div><b>HHSL Safety Systems Limited</b><span id="sub">Update your profile</span></div></header>
<main id="main"><div class="msg"><p><span class="spin"></span>Opening your link…</p></div></main>
<div class="dim" id="dim" hidden></div>
<script>
(function(){
'use strict';
var API='/.netlify/functions/profile-link';
var K=''; try{K=new URLSearchParams(location.search).get('k')||''}catch(e){}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var main=$('#main'),dim=$('#dim');
var ST={kind:'',label:'',form:null,edit:{},vals:{},photos:{},tg:{},email:'',email2:'',busy:false,errs:[]};
var ERT_DEF={contact:{l:'Contact number',t:'tel',m:1},contact2:{l:'Second phone number',t:'tel',m:1},emergency:{l:'Emergency contact number',t:'tel',m:1},address:{l:'Address',t:'text',h:1},city:{l:'City',t:'text',h:1},dob:{l:'Date of birth',t:'date',h:1},
 plea:{l:'PLEA number',t:'text',m:1},pleaExpiry:{l:'PLEA expiry date',t:'date',d:'Use the last day of the month on your expiry date.'},dpNumber:{l:'Driver\u2019s permit number',t:'text',m:1},dpClass:{l:'Driver\u2019s permit class',t:'text',cls:1},dpExpiry:{l:'Driver\u2019s permit expiry date',t:'date'},
 coc:{l:'Certificate of Character date',t:'date'},emtb:{l:'EMT B expiry date',t:'date'},emtp:{l:'EMT P expiry date',t:'date'}};
var STAFF_DEF={phone:{l:'Phone number',t:'tel',m:1},regIdNumber:{l:'ID number',t:'text',m:1}};
var KIND_KEYS={plea:['plea','pleaExpiry'],dp:['dpNumber','dpClass','dpExpiry'],coc:['coc'],emtb:['emtb'],emtp:['emtp']};
var PHOTO_LABEL={plea:'your PLEA passport',dp:'your driver\u2019s permit',coc:'your certificate of character',emtb:'your EMT B certificate',emtp:'your EMT P certificate'};
var REG_TYPES=['National ID','Passport','Driver\u2019s permit','Other'];
function normClass(v){var t=String(v||'').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean).filter(function(x){return x!=='AND'}),o=[];t.forEach(function(x){if(/^\d+$/.test(x))x.split('').forEach(function(c){o.push(c)});else o.push(x)});var s={};return o.filter(function(c){if(s[c])return false;s[c]=1;return true}).sort().join(',')}
function api(b){return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function msg(h){main.innerHTML=h;window.scrollTo(0,0)}
function doneErt(){var em='',mask='';try{if(ST.form&&ST.form.hasEmail)mask=String(ST.form.emailMask||'');else em=String(ST.email||'').trim().toLowerCase()}catch(e){}
  var url=location.origin+'/?signup=ert'+(em?'&email='+encodeURIComponent(em):'');
  msg('<div class="msg center"><div style="font-size:42px">\u2705</div><h1>Thank you</h1><p>Your details were sent to HHSL. This link no longer works.</p></div>'+
    '<div class="msg" style="margin-top:14px;text-align:left"><h2 style="margin:0 0 6px;font-size:19px">Next: create your account</h2><p style="margin:0 0 10px">With an account you can see your jobs, confirm them and keep your details up to date. Already have one? You are done.</p>'+
    ((em||mask)?'<div style="font-size:13px;opacity:.75;margin:0 0 4px">Sign up with this email</div><div style="min-height:44px;border:1.5px solid rgba(127,127,127,.35);border-radius:10px;display:flex;align-items:center;padding:0 12px;font-weight:700;margin:0 0 12px;word-break:break-all">'+esc(em||mask)+'</div>':'')+
    '<a id="mk-acct" href="'+esc(url)+'" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:#14506b;color:#fff;font-weight:800;text-decoration:none">Create my account</a>'+
    '<p style="font-size:13px;opacity:.75;margin:10px 0 0">You get an email to set your password. If it says your email cannot be found yet, the office is still checking your details. Try again later.</p></div>')}
function endPage(title,text,icon){msg('<div class="msg center"><div style="font-size:42px">'+(icon||'\u23F3')+'</div><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p></div>')}
function gone(){endPage('This link no longer works','It was already used, or it is older than 7 days. Ask the office to send you a new one.')}
function netErr(retry){msg('<div class="msg center"><h1>No connection</h1><p>We could not reach HHSL. Check your signal and try again.</p><button class="btn" id="retry">Try again</button></div>');$('#retry').onclick=retry}
/* ---- step 1: is the link good, and is it you? ---- */
function open(){
  if(!/^[A-Za-z0-9_-]{32}$/.test(K)){gone();return}
  api({action:'open',k:K}).then(function(r){
    if(!r||!r.ok){gone();return}
    ST.kind=r.kind;ST.label=r.label;
    msg('<div class="msg center"><div style="font-size:42px">\uD83D\uDC4B</div><h1 id="ttl">Is this you?</h1><p style="color:var(--ink);font-size:16px">You are updating the profile of</p><div class="big" id="who">'+esc(r.label)+'</div><button class="btn" id="yes">Yes, this is me</button><button class="btn g" id="no">This isn\u2019t me</button><p class="hint">This link works once and expires on '+esc(expText(r.expiresAt))+'.</p></div>');
    $('#yes').onclick=confirmMe;$('#no').onclick=notMe;
  }).catch(function(){netErr(open)});
}
function expText(iso){var d=new Date(iso),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return isNaN(d)?'':d.getUTCDate()+' '+m[d.getUTCMonth()]+' '+d.getUTCFullYear()}
function notMe(){api({action:'wrong',k:K}).then(function(){endPage('Thank you','We have cancelled this link. The office will send it to the right person.','\u2705')}).catch(function(){netErr(notMe)})}
function confirmMe(){
  msg('<div class="msg"><p><span class="spin"></span>One moment…</p></div>');
  api({action:'me',k:K}).then(function(r){if(!r||!r.ok){gone();return}ST.kind=r.kind;ST.form=r.form;ST.exp=r.expiresAt;$('#sub').textContent='Update your profile \u2022 '+r.label;render()}).catch(function(){netErr(confirmMe)});
}
/* ---- the form ---- */
function savedOf(key){return ST.form?ST.form[key]:null}
function fieldHtml(key,def){
  var s=savedOf(key),id='f-'+key,lab='<label for="'+id+'">'+esc(def.l)+'</label>'+(def.d?'<div class="hint" style="font-size:13.5px;color:#566573;margin:2px 0 4px">'+esc(def.d)+'</div>':'');
  if((def.m||def.h)&&s&&s.has&&!ST.edit[key]){return '<div>'+lab+'<div class="lock" id="lk-'+key+'"><span>'+(def.h?'Saved':esc(s.mask))+'</span><button type="button" data-edit="'+key+'">Edit</button></div></div>'}
  var v=ST.vals[key]!=null?ST.vals[key]:((def.m||def.h)?'':(s==null?'':s));
  return '<div>'+lab+'<input id="'+id+'" data-f="'+key+'" type="'+(def.t==='tel'?'tel':def.t==='date'?'date':'text')+'" value="'+esc(v)+'" autocomplete="off"'+(def.t==='tel'?' inputmode="tel"':'')+'></div>'}
function photoHtml(kind){
  var has=!!ST.photos[kind],need=kindChanged(kind);
  return '<label>Photo of '+PHOTO_LABEL[kind]+(need?' <i>*</i>':'')+'</label><label class="photo'+(has?' has':'')+'" id="ph-'+kind+'" style="margin:0;font-size:inherit;color:inherit">'+(has?'\u2713 Picture added':'\uD83D\uDDBC Add a picture')+'<small>'+(has?'Tap to change it':'Pictures only (JPG or PNG). For a PDF, take a screenshot.'+(need?' Needed for what you changed.':''))+'</small><input type="file" accept="image/*" data-p="'+kind+'"></label>'}
function changedVal(key){
  var def=(ST.kind==='ert'?ERT_DEF:STAFF_DEF)[key]||{},s=savedOf(key),v=String(ST.vals[key]==null?'':ST.vals[key]).replace(/\s+/g,' ').trim();
  if(def.cls)v=normClass(v);
  if(!v)return '';
  if(def.m||def.h)return ST.edit[key]||!(s&&s.has)?v:'';
  return v!==String(s==null?'':s)?v:'';
}
function kindChanged(kind){
  if((kind==='emtb'||kind==='emtp')&&!ST.tg[kind])return false;
  return KIND_KEYS[kind].some(function(k){return !!changedVal(k)});
}
function render(){
  var h='';
  if(ST.errs.length)h+='<div class="errs" id="errs" role="alert">Please fix these before sending:<ul>'+ST.errs.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul></div>';
  var f=ST.form;
  if(ST.kind==='ert'){
    h+='<div class="msg"><h2>Your details</h2><div class="grid2"><div><label for="nameDocs">Full name as on your documents <i>*</i></label><input id="nameDocs" type="text" data-n="1" value="'+esc(ST.vals.__name||'')+'" autocomplete="name"></div>'+
      ['contact','contact2','emergency','address','city','dob'].map(function(k){return fieldHtml(k,ERT_DEF[k])}).join('')+emailHtml()+'</div></div>';
    h+='<div class="msg"><h2>PLEA passport</h2><div class="grid2">'+fieldHtml('plea',ERT_DEF.plea)+fieldHtml('pleaExpiry',ERT_DEF.pleaExpiry)+'</div>'+photoHtml('plea')+'</div>';
    h+='<div class="msg"><h2>Driver\u2019s permit</h2><div class="grid2">'+fieldHtml('dpNumber',ERT_DEF.dpNumber)+fieldHtml('dpClass',ERT_DEF.dpClass)+fieldHtml('dpExpiry',ERT_DEF.dpExpiry)+'</div>'+photoHtml('dp')+'</div>';
    h+='<div class="msg"><h2>Certificate of Character</h2>'+fieldHtml('coc',ERT_DEF.coc)+photoHtml('coc')+'</div>';
    ['emtb','emtp'].forEach(function(k){var on=ST.tg[k]!=null?ST.tg[k]:!!(f&&f[k]);ST.tg[k]=on;h+='<div class="msg"><label class="tgl"><input type="checkbox" data-tg="'+k+'"'+(on?' checked':'')+'> I have '+(k==='emtb'?'EMT B':'EMT P')+'</label>'+(on?fieldHtml(k,ERT_DEF[k])+photoHtml(k):'')+'</div>'});
  }else{
    h+='<div class="msg"><h2>Your details</h2><div class="grid2"><div><label for="nameDocs">Full name as on your ID <i>*</i></label><input id="nameDocs" type="text" data-n="1" value="'+esc(ST.vals.__name||'')+'" autocomplete="name"></div>'+fieldHtml('phone',STAFF_DEF.phone)+
      '<div><label for="f-regIdType">ID type</label><select id="f-regIdType" data-f="regIdType">'+REG_TYPES.map(function(t){var cur=ST.vals.regIdType!=null?ST.vals.regIdType:((f&&f.regIdType)||'Driver\u2019s permit');return '<option'+(t===cur?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></div>'+fieldHtml('regIdNumber',STAFF_DEF.regIdNumber)+emailHtml()+'</div><p class="hint">No photos are needed.</p></div>';
  }
  h+='<div style="padding:0 4px"><button class="btn" id="send"'+(ST.busy?' disabled':'')+'>'+(ST.busy?'Sending\u2026':'Send to HHSL')+'</button><p class="hint">Your details go to HHSL to check. Nothing on your profile changes until they approve it.</p></div>';
  var keep=document.activeElement&&document.activeElement.id;msg(h);if(ST.errs.length){var e=$('#errs');if(e&&e.scrollIntoView)e.scrollIntoView({block:'center'})}else window.scrollTo(0,ST.__y||0);
  if(keep&&$('#'+keep)&&keep!=='send')try{$('#'+keep).focus()}catch(e){}
}
function emailHtml(){
  var f=ST.form;if(f&&f.hasEmail)return '<div><label>Email address</label><div class="lock" id="em-locked"><span>'+esc(f.emailMask)+'</span><span>\uD83D\uDD12</span></div><div class="hint">Your email can\u2019t be changed here. Contact the office to change it.</div></div>';
  return '<div><label for="em1">Email address <i>*</i></label><input id="em1" type="email" data-e="1" value="'+esc(ST.email)+'" autocomplete="email" inputmode="email"></div><div><label for="em2">Type your email again <i>*</i></label><input id="em2" type="email" data-e="2" value="'+esc(ST.email2)+'" autocomplete="off" inputmode="email"></div><div class="hint warn" style="grid-column:1/-1">This is the email you will use to create your account. Check every letter.</div>';
}
/* ---- events ---- */
main.addEventListener('click',function(ev){
  var t=ev.target.closest&&ev.target.closest('[data-edit]');if(t){ST.edit[t.dataset.edit]=true;render();var i=$('#f-'+t.dataset.edit);if(i)i.focus();return}
  if(ev.target.closest&&ev.target.closest('#send')){send()}
});
main.addEventListener('input',function(ev){var t=ev.target;
  if(t.dataset.f){ST.vals[t.dataset.f]=t.value}else if(t.dataset.n){ST.vals.__name=t.value}else if(t.dataset.e==='1'){ST.email=t.value}else if(t.dataset.e==='2'){ST.email2=t.value}});
main.addEventListener('change',function(ev){var t=ev.target;
  if(t.dataset.tg){ST.tg[t.dataset.tg]=t.checked;ST.__y=window.scrollY;render();return}
  if(t.dataset.f&&ST.kind==='ert'&&t.dataset.f==='dpClass'){ST.vals.dpClass=normClass(t.value);t.value=ST.vals.dpClass}
  if(t.dataset.f&&(t.type==='date'||t.tagName==='SELECT')){ST.vals[t.dataset.f]=t.value;ST.__y=window.scrollY;render()}
  if(t.dataset.p){pick(t.dataset.p,t.files&&t.files[0])}});
main.addEventListener('focusout',function(ev){var t=ev.target;if(t.dataset&&t.dataset.f==='dpClass'){ST.vals.dpClass=normClass(t.value);t.value=ST.vals.dpClass}});
function pick(kind,file){
  if(!file)return;
  if(!/^image\//.test(file.type||'')){ST.errs=['Please take a photo or a screenshot of the document. PDFs cannot be sent here.'];render();return}
  shrink(file).then(function(d){ST.photos[kind]=d;ST.errs=[];ST.__y=window.scrollY;render()}).catch(function(){ST.errs=['That picture could not be read. Take a new photo or a screenshot.'];render()});
}
function shrink(file){return new Promise(function(res,rej){var url=URL.createObjectURL(file),im=new Image();im.onload=function(){URL.revokeObjectURL(url);function go(edge,q){var w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,edge/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
  var steps=[[1400,.72],[1100,.6],[900,.5],[700,.45]],d='';for(var i=0;i<steps.length;i++){d=go(steps[i][0],steps[i][1]);if(d.length<=480000)break}res(d)};im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('image'))};im.src=url})}
/* ---- send ---- */
function collect(){
  var errs=[],fields={},photos={},defs=ST.kind==='ert'?ERT_DEF:STAFF_DEF,name=String(ST.vals.__name||'').replace(/\s+/g,' ').trim();
  if(name.length<2)errs.push('Type your full name as it is on your '+(ST.kind==='ert'?'documents':'ID')+'.');
  Object.keys(defs).forEach(function(k){if(ST.kind==='ert'&&(k==='emtb'||k==='emtp')&&!ST.tg[k])return;var v=changedVal(k);if(v){if(defs[k].t==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))errs.push('Check the date for '+defs[k].l.toLowerCase()+'.');else if(defs[k].t==='tel'&&!/^[0-9+()\-\s]{6,25}$/.test(v))errs.push('Check '+defs[k].l.toLowerCase()+': use numbers only.');else fields[k]=v}});
  if(ST.kind==='staff'){var savedTy=(ST.form&&ST.form.regIdType)||'',ty=ST.vals.regIdType!=null?ST.vals.regIdType:(savedTy||'Driver\u2019s permit');if(fields.regIdNumber||(ST.vals.regIdType!=null&&ty!==savedTy))fields.regIdType=ty}
  if(ST.kind==='ert')Object.keys(KIND_KEYS).forEach(function(k){if(!kindChanged(k))return;if(ST.photos[k])photos[k]=ST.photos[k];else errs.push('Add a picture of '+PHOTO_LABEL[k]+' so the office can check it.')});
  var email='';if(!(ST.form&&ST.form.hasEmail)){var e1=String(ST.email||'').trim().toLowerCase(),e2=String(ST.email2||'').trim().toLowerCase();
    if(!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(e1))errs.push('Type your email address. It is what you will use to create your account.');else if(e1!==e2)errs.push('The two email addresses are not the same.');else email=e1}
  if(!errs.length&&!Object.keys(fields).length&&!email)errs.push('There is nothing to send yet. Change or add a detail first.');
  return {errs:errs,body:{action:'submit',k:K,nameOnDocs:name,fields:fields,email:email,photos:photos}};
}
function send(){
  if(ST.busy)return;var c=collect();ST.errs=c.errs;if(c.errs.length){render();return}
  if(c.body.email){askEmail(c.body.email,function(){post(c.body)});return}
  post(c.body);
}
function askEmail(em,go){
  dim.hidden=false;dim.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Is this correct?</h2><p class="hint" style="font-size:14.5px">This is the email you will use to create your account.</p><div class="em" id="em-show">'+esc(em)+'</div><p class="hint warn">A wrong letter means you won\u2019t be able to create your account.</p><button class="btn" id="em-yes">Yes, it\u2019s correct</button><button class="btn g" id="em-edit">Edit</button></div>';
  $('#em-yes').onclick=function(){dim.hidden=true;dim.innerHTML='';go()};$('#em-edit').onclick=function(){dim.hidden=true;dim.innerHTML='';var i=$('#em1');if(i)i.focus()};
}
function post(body){
  ST.busy=true;ST.__y=window.scrollY;render();
  api(body).then(function(r){
    ST.busy=false;
    if(r&&r.ok){if(ST.kind==='ert'){doneErt()}else{endPage('Thank you','Your details were sent to HHSL. This link no longer works.','\u2705')}return}
    if(r&&r.state==='invalid_input'){ST.errs=r.errors||['Something is not right. Check your details.'];render();return}
    gone();
  }).catch(function(){ST.busy=false;ST.errs=['We could not reach HHSL. Check your signal and tap Send again.'];render()});
}
open();
})();
